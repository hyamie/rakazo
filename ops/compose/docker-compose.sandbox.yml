# Local Docker computers on top of the hardened prod stack.
#
# docker-compose.prod.yml is the hardened topology but pins SANDBOX_PROVIDER to
# e2b and ships no supervisor, so bot computers can only run off-host. E2B is
# not viable here: its free tier caps a sandbox session at one hour and Rakazo's
# model is a persistent Team Computer, which puts it on the $150/mo Pro tier.
#
# This overlay grafts the supervisor and the computer image onto the prod stack
# and flips the provider back to docker. It is applied on top of, never instead
# of, the prod file:
#
#   docker compose --env-file "$PWD/.env" \
#     -f infra/compose/docker-compose.prod.yml \
#     -f ops/compose/docker-compose.sandbox.yml \
#     up -d --build
#
# Every relative path below is resolved against the PROJECT DIRECTORY, which
# Compose takes from the first -f file: infra/compose, not ops/compose. That is
# why the build contexts read as if this file lived beside the prod one, and why
# --project-directory must NOT be overridden: doing so repoints the prod file's
# own `env_file: ../../.env` at /.env and the stack fails to resolve.
#
# Everything HDS-specific lives under ops/ so that merging upstream never
# conflicts with our deployment configuration.

services:
  # Build-only target. The supervisor creates bot computers from this image by
  # name, so it has to exist locally before the first bot starts; it is not a
  # long-running service.
  computer:
    image: rakazo/computer:local
    build:
      context: ../sandboxes/computer
    command: ["true"]
    restart: "no"

  supervisor:
    # Runs from the application image, the way upstream's own
    # docker-compose.images.yml does, NOT from infra/sandboxes/supervisor/Dockerfile.
    #
    # That Dockerfile does not install the supervisor's workspace dependencies. It
    # was survivable while the supervisor only imported @rakazo/core, and it stopped
    # being survivable when upstream added @rakazo/logging to its imports: the
    # container crash-loops on ERR_MODULE_NOT_FOUND for a package that is declared
    # right there in infra/sandboxes/supervisor/package.json. The app image already
    # contains the whole workspace, so `pnpm --filter` just runs it.
    #
    # This also means a future updater rollback covers the supervisor, because it
    # moves with RAKAZO_IMAGE_TAG like api, worker and web.
    image: ${RAKAZO_IMAGE:-ghcr.io/elie222/rakazo/app}:${RAKAZO_IMAGE_TAG:-local}
    command: ["pnpm", "--filter", "@rakazo/sandbox-supervisor", "start"]
    user: root
    restart: unless-stopped
    init: true
    # No `cap_drop: ALL` and no `no-new-privileges` here, unlike its siblings:
    # this process talks to the Docker socket and creating containers needs the
    # privileges that come with it. That asymmetry is exactly why the whole
    # stack lives in a dedicated VM rather than beside the other node-2
    # services, and why it sits on an isolated VLAN.
    pids_limit: 256
    mem_limit: 512m
    env_file:
      - ../../.env
    environment:
      DATA_DIR: /data
      SUPERVISOR_HOST: "0.0.0.0"
      SUPERVISOR_PORT: "7091"
      DOCKER_SOCKET: /var/run/docker.sock
      RAKAZO_COMPUTER_IMAGE: rakazo/computer:local
      # What the bot can see of the host, beyond its own workspace.
      #
      # /mnt/projects is Mike's live project trees, NFS from RipOrDie. It is
      # read-only at three independent layers: the server export is `ro`, the
      # guest mount is `ro`, and this bind is `ro`. That matters because the
      # computer image has no USER directive, so the bot runs as root inside its
      # container; the export's all_squash pins it to uid 1000 regardless, so it
      # reads exactly what Mike can read and can write nothing.
      #
      # Writes go to /mnt/work instead. The bot clones a repo out of the
      # read-only tree and commits on its own branch there, which is the
      # isolation a worktree would give without handing it write access to the
      # real .git. `git worktree add` cannot work against a read-only source: it
      # has to create a ref in the source repo and fails with "cannot lock ref".
      #
      # Both targets are deliberately outside /home/rakazo. That directory is the
      # portable workspace and AgentHomeStore copies it into DATA_DIR at every run
      # boundary, so a 64 GB tree mounted inside it would be walked and copied on
      # every run. computerExtraMounts() refuses such a target outright.
      RAKAZO_COMPUTER_EXTRA_MOUNTS: ${RAKAZO_COMPUTER_EXTRA_MOUNTS:-/mnt/projects:/mnt/projects:ro,/var/rakazo/botwork:/mnt/work:rw}
      # Screens are reached through the `web` container, never through a host
      # port. In `isolated` mode the supervisor puts each bot computer on its own
      # bridge network and attaches `web` to it (connectComposeScreenPeers finds
      # the container labelled com.docker.compose.service=web in this project),
      # then hands back the computer's container IP. `web` is the only thing that
      # dials it, and Caddy already fronts `web` for the browser.
      #
      # This replaces the RAKAZO_COMPUTER_BIND_HOST / SANDBOX_SCREEN_HOST pair
      # this overlay used to carry. Those existed because the upstream default
      # published the screen on loopback, which is not the host from inside a
      # container, so the readiness probe hung its full timeout on every run and
      # the bot never answered; pinning both to the docker bridge gateway fixed
      # that at the cost of an unauthenticated VNC port on the host. Isolated
      # mode removes the port entirely, so it is strictly better and both
      # variables are now dead here.
      SANDBOX_SCREEN_NETWORK: ${SANDBOX_SCREEN_NETWORK:-isolated}
      SANDBOX_SUPERVISOR_TOKEN: ${SANDBOX_SUPERVISOR_TOKEN:?Set SANDBOX_SUPERVISOR_TOKEN in .env}
      # Per-computer ceilings. Rakazo leaves bot computers uncapped upstream;
      # feat/sandbox-resource-limits adds these and they are set explicitly here
      # so the sizing is visible next to the host it runs on.
      RAKAZO_COMPUTER_MEMORY: ${RAKAZO_COMPUTER_MEMORY:-2g}
      RAKAZO_COMPUTER_CPUS: ${RAKAZO_COMPUTER_CPUS:-1.5}
      RAKAZO_COMPUTER_PIDS_LIMIT: ${RAKAZO_COMPUTER_PIDS_LIMIT:-512}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - appdata:/data
    networks:
      - control
    depends_on:
      computer:
        condition: service_completed_successfully

  api:
    environment:
      # Every model reaches this deployment through the LiteLLM gateway on
      # node-1 and nothing else. The gateway is wired as Rakazo's `local`
      # provider (RAKAZO_LOCAL_MODELS_URL), per dev-infra's
      # docs/rakazo-llm-access-prompt.md. Without this the picker still lists
      # OpenRouter, Anthropic and OpenAI, and anyone with workspace access could
      # paste a key and spend on a provider that bypasses the gateway entirely.
      RAKAZO_PROVIDER_ALLOWLIST: ${RAKAZO_PROVIDER_ALLOWLIST:-local}
      SANDBOX_PROVIDER: docker
      SANDBOX_SUPERVISOR_URL: http://supervisor:7091
      SANDBOX_SUPERVISOR_TOKEN: ${SANDBOX_SUPERVISOR_TOKEN:?Set SANDBOX_SUPERVISOR_TOKEN in .env}
      # Upstream prod wires api to the updater. We do not run it: a second
      # root-equivalent Docker socket for a single-operator internal tool is not
      # worth the exposure, and its official path refuses anyway while only a
      # v0.1.0-beta prerelease tag exists.
      RAKAZO_UPDATER_URL: ""
      NODE_EXTRA_CA_CERTS: /etc/ssl/rakazo/qmd-gateway.crt
    # The qmd MCP gateway on RipOrDie is addressed by LAN IP, which can never hold
    # a publicly-issued certificate, so its TLS front is self-signed and therefore
    # its own CA. Node is pointed at that one file rather than the system trust
    # store being rewritten, which keeps the trust scoped to exactly one host.
    #
    # The certificate is deployment data, not source: ops/certs/ is gitignored and
    # the file is copied to the host out of band (see ops/README.md). If it is
    # missing, Docker silently creates a DIRECTORY at the source path instead of
    # failing, Node ignores a non-file NODE_EXTRA_CA_CERTS, and the only symptom is
    # a TLS error on the first MCP call. Check this path before blaming the gateway.
    volumes:
      - ../../ops/certs/qmd-gateway.crt:/etc/ssl/rakazo/qmd-gateway.crt:ro
    depends_on:
      supervisor:
        condition: service_started

  worker:
    environment:
      RAKAZO_PROVIDER_ALLOWLIST: ${RAKAZO_PROVIDER_ALLOWLIST:-local}
      SANDBOX_PROVIDER: docker
      SANDBOX_SUPERVISOR_URL: http://supervisor:7091
      SANDBOX_SUPERVISOR_TOKEN: ${SANDBOX_SUPERVISOR_TOKEN:?Set SANDBOX_SUPERVISOR_TOKEN in .env}
      NODE_EXTRA_CA_CERTS: /etc/ssl/rakazo/qmd-gateway.crt
    # The qmd MCP gateway on RipOrDie is addressed by LAN IP, which can never hold
    # a publicly-issued certificate, so its TLS front is self-signed and therefore
    # its own CA. Node is pointed at that one file rather than the system trust
    # store being rewritten, which keeps the trust scoped to exactly one host.
    #
    # The certificate is deployment data, not source: ops/certs/ is gitignored and
    # the file is copied to the host out of band (see ops/README.md). If it is
    # missing, Docker silently creates a DIRECTORY at the source path instead of
    # failing, Node ignores a non-file NODE_EXTRA_CA_CERTS, and the only symptom is
    # a TLS error on the first MCP call. Check this path before blaming the gateway.
    volumes:
      - ../../ops/certs/qmd-gateway.crt:/etc/ssl/rakazo/qmd-gateway.crt:ro
    # The worker drives the run loop and therefore talks to the supervisor, so it
    # needs `control` on top of the app/data it gets from the prod file. Upstream
    # does not list it because upstream's worker uses e2b and never calls a
    # supervisor at all. Omitting it does not fail loudly: the hostname simply
    # does not resolve, every run dies in setup with "fetch failed", and the bot
    # goes silent while its computer container sits there running perfectly.
    networks:
      - app
      - data
      - control
    depends_on:
      supervisor:
        condition: service_started

  # Not run. Assigning a profile that is never activated is the documented way
  # to exclude a service the base file defines: `up` skips it entirely.
  updater:
    profiles: ["never"]
