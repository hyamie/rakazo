# Fork-only. Upstream has no file by this name, so it never conflicts on a sync.
#
# The deployment runs two compose files, and nothing upstream renders that pair.
# A new `${VAR:?...}` in the prod file, or a change that makes the overlay stop
# resolving against it, would otherwise be found by `deploy.sh` on the box.
name: hds-deploy-check

on:
  pull_request:
    branches: [deploy/hds]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-config:
    name: Render the deployment compose files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Both compose files declare `env_file: ../../.env`, which --env-file does
      # not satisfy: it supplies interpolation, not the file the service reads.
      # Without this the render fails on a missing file rather than on anything
      # this check is meant to catch.
      - name: Stage a dummy environment
        run: cp ops/ci/compose-check.env .env

      # The overlay needs a certificate at a path Docker would otherwise create
      # as a directory. Contents are irrelevant to `config`; presence is not.
      - name: Stage the qmd CA placeholder
        run: |
          mkdir -p ops/certs
          printf 'not a certificate, present only so the bind mount resolves\n' \
            > ops/certs/qmd-gateway.crt

      # Project directory comes from the FIRST -f file, so both paths resolve the
      # way deploy.sh resolves them. Do not add --project-directory.
      - name: Render both files
        run: |
          docker compose --env-file .env \
            -f infra/compose/docker-compose.prod.yml \
            -f ops/compose/docker-compose.sandbox.yml \
            config --quiet

      # The supervisor must run from the application image, not from
      # infra/sandboxes/supervisor/Dockerfile, which does not install its
      # workspace dependencies. That distinction is invisible in a render and
      # only shows up as an ERR_MODULE_NOT_FOUND crash-loop on the deployment,
      # which is exactly how it was found: upstream added @rakazo/logging to the
      # supervisor and the standalone image stopped booting.
      - name: Assert the supervisor runs from the application image
        run: |
          docker compose --env-file .env \
            -f infra/compose/docker-compose.prod.yml \
            -f ops/compose/docker-compose.sandbox.yml config --format json > /tmp/rendered.json
          python3 - <<'PY'
          import json, sys
          svc = json.load(open("/tmp/rendered.json"))["services"]
          api, sup = svc["api"], svc["supervisor"]
          print("api image:", api.get("image"), "| supervisor image:", sup.get("image"))
          ok = True
          if sup.get("image") != api.get("image"):
              print(f"::error::supervisor image {sup.get('image')!r} must match api {api.get('image')!r}")
              ok = False
          if sup.get("build") is not None:
              print("::error::the supervisor must not be built from its own Dockerfile; it lacks the workspace deps")
              ok = False
          sys.exit(0 if ok else 1)
          PY

      # The overlay's whole job is grafting the supervisor and the computer image
      # onto the prod stack. A rename or a stray profile upstream would drop them
      # silently, and `config --quiet` would still pass.
      - name: Assert the overlay's services survive the merge
        run: |
          services="$(docker compose --env-file .env \
            -f infra/compose/docker-compose.prod.yml \
            -f ops/compose/docker-compose.sandbox.yml \
            config --services)"
          echo "$services"
          for required in api worker web supervisor computer; do
            printf '%s\n' "$services" | grep -qx "$required" \
              || { echo "::error::the rendered stack has no '$required' service"; exit 1; }
          done
